<style>
:root{--p:#1A1A1A;--p2:#808080;--on:#E8E8E8;--bg:#E8E8E8;--bgi:radial-gradient(90% 40% at 85% 0%,rgba(255,255,255,.9),transparent 70%),radial-gradient(70% 40% at 0% 50%,rgba(192,192,192,.6),transparent 70%);--tx:#1A1A1A;--mu:#5a5a5a;--card:rgba(255,255,255,.62);--nav:rgba(255,255,255,.78);--in:rgba(255,255,255,.7);--soft:rgba(26,26,26,.07);--line:rgba(26,26,26,.12);--res:rgba(26,26,26,.06);--bar:rgba(26,26,26,.12);--al:#fff4d6;--alt:#6b4a00;--ok:#13804f;--bad:#c53a2c;--hero:linear-gradient(135deg,#1A1A1A,#3a3a3a 55%,#808080);--herotx:#E8E8E8}
html[data-theme=dark]{color-scheme:dark;--p:#C0C0C0;--p2:#E8E8E8;--on:#000;--bg:#000;--bgi:radial-gradient(90% 40% at 85% 0%,rgba(192,192,192,.18),transparent 70%),radial-gradient(70% 40% at 0% 50%,rgba(128,128,128,.16),transparent 70%);--tx:#E8E8E8;--mu:#9a9a9a;--card:rgba(26,26,26,.7);--nav:rgba(18,18,18,.8);--in:rgba(0,0,0,.45);--soft:rgba(192,192,192,.1);--line:rgba(192,192,192,.16);--res:rgba(192,192,192,.08);--bar:rgba(192,192,192,.18);--al:#2a2410;--alt:#f0c36b;--ok:#3ddc97;--bad:#ff6b5e;--hero:linear-gradient(135deg,#E8E8E8,#C0C0C0 45%,#808080);--herotx:#000}
html{background-color:var(--bg);background-image:var(--bgi);background-attachment:fixed}
#gear,#agbtn{color:var(--tx);display:flex;align-items:center;justify-content:center;padding:0;position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:30;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--nav);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:21px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Roboto,system-ui,sans-serif;color:var(--tx);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px}
header{padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px}header small{color:var(--mu);display:block;font-size:13px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 16px;box-shadow:0 4px 18px rgba(0,0,0,.18);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hero{background:var(--hero);color:var(--herotx);border-radius:26px;padding:22px;margin:14px 16px}
.hero small{opacity:.85}.hero .big{font-size:34px;font-weight:700;margin:4px 0 14px}
.hero .row{display:flex;gap:10px}.hero .row div{flex:1;background:color-mix(in srgb,var(--herotx) 12%,transparent);border-radius:14px;padding:10px;font-size:13px}
.hero .row b{display:block;font-size:15px;margin-top:2px}
h2{font-size:16px;margin:4px 0 12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.bars i{display:block;background:var(--bar);border-radius:8px;margin-bottom:5px;min-height:4px}
.bars i.hi{background:var(--p)}
.alert{background:var(--al);color:var(--alt);border-radius:16px;padding:12px 14px;margin:14px 16px;font-size:14px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.ic{width:42px;height:42px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.item .t{flex:1}.item .t b{display:block;font-size:15px}.item .t small{color:var(--mu)}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600;background:linear-gradient(135deg,var(--p2),var(--p));color:var(--on);width:100%}
.btn.s{width:auto;padding:8px 12px;font-size:13px}.btn.g{background:var(--soft);color:var(--p)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;background:var(--in);color:var(--tx)}
.two{display:flex;gap:10px}
.res{background:var(--res);border-radius:16px;padding:14px;margin-top:14px;font-size:15px;line-height:1.5}
nav{z-index:35;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--nav);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.2);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:24px 24px 0 0}

nav button span{font-size:21px}nav button.on{color:var(--p);font-weight:700}
nav .plus{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--p2),var(--p));color:var(--on);font-size:30px;margin-top:-30px;justify-content:center;box-shadow:0 6px 16px rgba(192,192,192,.3)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;z-index:46}
#sheet.on{display:flex}
#sheet>div{background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);width:100%;max-width:480px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px 20px 30px;max-height:92vh;overflow:auto}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-size:15px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--p);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chat{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 13px;border-radius:16px;max-width:85%;font-size:15px;line-height:1.4}
.me{align-self:flex-end;background:var(--p);color:var(--on)}.ia{align-self:flex-start;background:var(--soft)}
.empty{color:var(--mu);text-align:center;padding:14px;font-size:14px}
.mn{display:flex;justify-content:space-between;align-items:center}
.bk{height:10px;border-radius:6px;background:var(--bar);overflow:hidden}.bk i{display:block;height:100%;border-radius:6px}
#splash{position:fixed;inset:0;background:#000 radial-gradient(70% 45% at 50% 40%,#1c1c1c,#000 70%);display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .7s ease}
#splash.off{opacity:0;pointer-events:none}
#splash .lg{width:min(36vw,160px);perspective:600px}
#splash svg{display:block;width:100%;overflow:visible}
#splash text{font-family:"Orbitron","Eurostile","Segoe UI",system-ui,sans-serif;font-weight:400}
.mkw{position:relative}
.mk{filter:drop-shadow(0 0 8px rgba(232,232,232,.35));animation:spin 2s cubic-bezier(.16,.8,.2,1) .3s both}
.flare{position:absolute;left:6%;right:6%;top:64%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 14px 3px rgba(232,232,232,.55);transform:scaleX(0);opacity:0;animation:flare 1.3s ease-out .1s both}
.b{transform-box:fill-box;transform-origin:50% 100%;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1s + var(--i)*.13s)}
.fl,.sw{animation:slide 1s cubic-bezier(.2,.8,.2,1) both}
.fl{animation-delay:1.15s}.sw{animation-delay:1.3s}
.shine{animation:shn 1.5s ease-in-out 2.3s both}
.wm{animation:wm 1.3s ease-out 2s both}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s ease-out 2.5s forwards}
.ln.ar{animation-delay:3s}
.tg{animation:fade 1.1s ease-out 3.2s both}.tg.t2{animation-delay:3.5s}
@keyframes spin{from{transform:rotateY(-110deg) scale(.88);opacity:0}30%{opacity:1}to{transform:rotateY(0) scale(1);opacity:1}}
@keyframes flare{0%{transform:scaleX(0);opacity:0}35%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1.25);opacity:0}}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes slide{from{transform:translateX(-34px);opacity:0}to{transform:none;opacity:1}}
@keyframes shn{from{transform:translateX(-200px) skewX(-20deg);opacity:1}to{transform:translateX(560px) skewX(-20deg);opacity:1}}
@keyframes wm{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash *{animation:none!important}.ln{stroke-dashoffset:0!important}.flare,.shine{display:none}}
body.chat{padding-bottom:0}
body.chat nav,body.chat #gear,body.set #gear,body.chat #agbtn{display:none}
.chatwrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom))}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.hero .row{flex-wrap:wrap}.hero .row div{min-width:40%}
#auth{--p:#C0C0C0;--p2:#E8E8E8;--on:#000;--tx:#E8E8E8;--mu:#9a9a9a;--line:rgba(192,192,192,.18);--soft:rgba(192,192,192,.1);--in:rgba(0,0,0,.5);--bad:#ff6b5e;--card:#1A1A1A;color:#E8E8E8;color-scheme:dark;position:fixed;inset:0;z-index:45;display:none;flex-direction:column;justify-content:center;padding:24px;background:#000 radial-gradient(70% 40% at 50% 0%,#222,#000 70%);overflow:auto}

.hero .phr{font-size:14px;margin:4px 0 14px;opacity:.92;line-height:1.35;cursor:pointer}
.wg{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:14px;margin:14px 16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wgi{display:flex;align-items:center;gap:14px;width:100%;background:var(--soft);border:0;border-radius:26px;padding:16px 18px;color:var(--tx);font-size:16px;text-align:left}

.wgb{display:flex;justify-content:space-between;margin-top:12px}

.sg{padding:4px 16px}
.srow{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 0;color:var(--tx);text-align:left;font-size:15px}
.srow:last-child{border-bottom:0}
.si{width:36px;height:36px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.st{flex:1;min-width:0}.st b{display:block;font-weight:600}

.swt{width:48px;height:28px;border-radius:14px;background:var(--bar);position:relative;flex:none;transition:background .2s}

.swt.on{background:var(--p)}.swt.on i{transform:translateX(20px);background:var(--on)}
.two>div{min-width:0;flex:1}
input[type=date]{display:block;min-height:46px;text-align:left;-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-date-and-time-value{text-align:left}
#agbtn{right:64px}

#welcome{--soft:rgba(192,192,192,.1);--p:#C0C0C0;--p2:#E8E8E8;--on:#000;--tx:#E8E8E8;--mu:#9a9a9a;--line:rgba(192,192,192,.18);color:#E8E8E8;color-scheme:dark;position:fixed;inset:0;z-index:44;display:none;background:#000 radial-gradient(80% 45% at 50% 0%,#252525,#000 70%);overflow:auto}

.wbox{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(34px + env(safe-area-inset-top)) 26px calc(26px + env(safe-area-inset-bottom));gap:18px}

<script>
const $=s=>document.querySelector(s);
const DEF=()=>({tx:[],token:'',chat:[],goals:[],inv:[],ag:[],cm:[]});
let S=DEF(),KEY=null;
const load=k=>{try{return Object.assign(DEF(),JSON.parse(localStorage.getItem(k))||{})}catch(e){return DEF()}};
let CL=null,SB=null,PT=null;
const save=ns=>{
  if(!KEY)return;
  if(!ns)S._t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(CL&&SB&&!ns){clearTimeout(PT);PT=setTimeout(pushNow,1500)}
};
async function pushNow(){
  if(!(CL&&SB))return;
  const {token,av,wx,chat,cityLoc,...pub}=S;
  try{await SB.from('user_data').upsert({user_id:CL.id,data:pub,updated_at:new Date().toISOString()})}catch(e){}
}
const AK='fin_accounts';
let AC={users:{},cur:''};
try{AC=Object.assign(AC,JSON.parse(localStorage.getItem(AK))||{})}catch(e){}
const saveAC=()=>{try{localStorage.setItem(AK,JSON.stringify(AC))}catch(e){}};
let CFG={url:'',key:''};
try{CFG=Object.assign(CFG,JSON.parse(localStorage.getItem('fin_cfg'))||{})}catch(e){}
const cloudOn=()=>!!(CFG.url&&CFG.key);
const nm=()=>CL?CL.name:(AC.users[AC.cur]||{}).name||'';
const fn=()=>nm().split(' ')[0]||'você';
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT={Delivery:'🍔',Assinaturas:'📺',Pessoal:'🧴',Casa:'🏠',Transporte:'🚗',Lazer:'🎮',Salário:'💼',Outros:'📦'};
let tab='home';

/* ===== CÁLCULOS ===== */
const ins=()=>S.tx.filter(t=>t.type=='in');
const outs=()=>S.tx.filter(t=>t.type=='out'&&t.paid!==false);
const pend=()=>S.tx.filter(t=>t.type=='out'&&t.paid===false).sort((a,b)=>a.date<b.date?-1:1);
const sum=a=>a.reduce((s,t)=>s+t.val,0);
const saldo=()=>sum(ins())-sum(outs());
const month=()=>iso(new Date()).slice(0,7);
function byCat(){const m={};outs().filter(t=>t.date.startsWith(month())).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.val);return m}

/* ===== TELAS ===== */
function item(t,btn){
  return `<div class="item"><div class="ic">${CAT[t.cat]||'📦'}</div><div class="t"><b>${esc(t.name)}</b><small>${t.cat}${t.bank?' · '+esc(t.bank):''} · ${t.date.split('-').reverse().join('/')}</small></div>
  ${btn?`<button class="btn s g" onclick="pay('${t.id}')">Pagar</button>`:`<span class="${t.type=='in'?'pos':'neg'}">${t.type=='in'?'+':'−'}${R(t.val)}</span>`}</div>`;
}
const billRow=t=>`<div class="item"><div class="ic">${CAT[t.cat]||'📦'}</div><div class="t"><b>${esc(t.name)}</b><small class="${t.date<iso(new Date())?'neg':''}">${R(t.val)} · vence ${t.date.split('-').reverse().join('/')}</small></div><button class="btn s g" onclick="pay('${t.id}')">Pagar</button></div>`;
function mesCalc(){
  const mk=month(),d=new Date(),fim=iso(new Date(d.getFullYear(),d.getMonth()+1,0));
  const rec=sum(ins().filter(t=>t.date.startsWith(mk))),gast=sum(outs().filter(t=>t.date.startsWith(mk)));
  const pagar=sum(pend().filter(t=>t.date<=fim)),sep=(S.cm||[]).filter(c=>c.d.startsWith(mk)).reduce((a,c)=>a+c.res+c.inv,0);
  return {rec,gast,pagar,sep,livre:rec-gast-pagar-sep};
}
function home(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const vals=days.map(d=>sum(outs().filter(t=>t.date==iso(d))));
  const mx=Math.max(...vals,1);
  const bars=days.map((d,i)=>`<div><i class="${i==6?'hi':''}" style="height:${vals[i]/mx*90}px"></i>${'DSTQQSS'[d.getDay()]}</div>`).join('');
  const soon=pend().filter(t=>t.date<=iso(new Date(Date.now()+3*864e5)));
  const cats=Object.entries(byCat()).sort((a,b)=>b[1]-a[1]);
  const M=mesCalc(),livre=Math.max(0,M.livre);
  const rec=[...S.tx].sort((a,b)=>a.date<b.date?1:-1).slice(0,6);
  return `<header><div><small style="letter-spacing:.32em;font-weight:600">FREIVORA</small><h1>Suas finanças</h1></div></header>
  <div class="hero"><div class="mn"><b style="font-size:18px">Olá, ${esc(fn())} 👋</b></div><div class="phr">${esc(curPhrase())}</div><small>Valor livre do mês</small><div class="big">${R(M.livre)}</div><small style="display:block;margin:-8px 0 12px;opacity:.8">${M.livre<0?'Você já usou mais do que recebeu neste mês.':'Receitas − gastos − a pagar − separado'}</small>
  <div class="row"><div>Receitas do mês<b>${R(M.rec)}</b></div><div>A pagar<b>${R(M.pagar)}</b></div><div>Gastos<b>${R(M.gast)}</b></div><div>Separado<b>${R(M.sep)}</b></div></div></div>
  ${widget()}
  ${soon.length?`<div class="alert">🔔 ${soon.length} conta(s) vencendo em até 3 dias: ${soon.map(t=>esc(t.name)).join(', ')}</div>`:''}
  <div class="card"><div class="mn"><h2 style="margin:0">Contas a pagar</h2><button class="btn s g" onclick="tab='bills';render()">Ver todas ›</button></div>${pend().length?pend().slice(0,3).map(billRow).join(''):'<div class="empty">Nenhuma conta pendente.</div>'}</div>
  <div class="card"><h2>Gastos nos últimos 7 dias</h2><div class="bars">${bars}</div></div>
  <div class="card"><h2>Neste mês</h2>${cats.length?cats.map(([c,v])=>`<div class="item"><div class="ic">${CAT[c]||'📦'}</div><div class="t">Você gastou <b>${R(v)}</b> com ${c}</div></div>`).join(''):'<div class="empty">Sem gastos ainda. Toque em ＋ para lançar o primeiro.</div>'}
  <div class="res">💡 Você pode investir hoje: <b>${R(livre)}</b><br><small>Valor livre do mês, já sem contas a pagar e sem o que foi separado.</small></div></div>
  <div class="card"><h2>Recentes</h2>${rec.length?rec.map(t=>item(t)).join(''):'<div class="empty">Nada por aqui ainda.</div>'}</div>`;
}
function bills(){
  const p=pend();
  return `<header class="sub"><button class="back" onclick="tab='home';render()">←</button><h1>Contas a pagar</h1></header>
  <div class="card">${p.length?p.map(t=>item(t,1)+`<small class="${t.date<iso(new Date())?'neg':''}" style="margin-left:54px">${R(t.val)} · vence ${t.date.split('-').reverse().join('/')}${t.date<iso(new Date())?' (atrasada)':''}</small>`).join(''):'<div class="empty">Nenhuma conta pendente. Use ＋ e marque "É uma conta a pagar".</div>'}</div>
  <div class="alert">Lembretes no celular (notificação no dia do vencimento) entram na etapa 2.</div>`;
}
/* ===== CARTÕES / OPEN FINANCE (bancos vêm automáticos) ===== */
let cm=0;
const BC=['#E8E8E8','#9aa0a6','#C0C0C0','#808080'];
const mkey=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return iso(d).slice(0,7)};
const banks=()=>[...new Set(S.tx.filter(t=>t.card&&t.bank).map(t=>t.bank))].sort();
function cards(){
  const k=mkey(cm),cs=S.tx.filter(t=>t.card&&t.type=='out'&&t.date.startsWith(k)),bs=banks();
  const mes=new Date(k+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const tot=sum(cs),mx=Math.max(...bs.map(b=>sum(cs.filter(t=>t.bank==b))),1);
  const bank=(b,i)=>{
    const l=cs.filter(t=>t.bank==b).sort((x,y)=>x.date<y.date?1:-1),c={};
    l.forEach(t=>c[t.cat]=(c[t.cat]||0)+t.val);
    const top=Object.entries(c).sort((x,y)=>y[1]-x[1]).slice(0,3);
    return `<div class="card"><div class="mn"><h2 style="margin:0">${esc(b)}</h2><b>${R(sum(l))}</b></div>
    <div class="bk" style="margin:10px 0"><i style="width:${sum(l)/mx*100}%;background:${BC[i%BC.length]}"></i></div>
    ${top.map(x=>`<small style="color:var(--mu);display:block">${CAT[x[0]]||'📦'} ${x[0]}: ${R(x[1])}</small>`).join('')}
    <div style="margin-top:10px">${l.length?l.slice(0,5).map(t=>item(t)).join(''):'<div class="empty">Nenhum gasto neste mês.</div>'}</div></div>`;
  };
  return `<header><h1>Cartões</h1></header>
  <div class="hero"><div class="mn"><button class="back" style="background:color-mix(in srgb,var(--herotx) 15%,transparent);color:var(--herotx)" onclick="cm--;render()">‹</button><small>${mes[0].toUpperCase()+mes.slice(1)}</small><button class="back" style="background:color-mix(in srgb,var(--herotx) 15%,transparent);color:var(--herotx)" onclick="if(cm<0){cm++;render()}">›</button></div>
  <div class="big" style="margin-top:10px">${R(tot)}</div>
  ${bs.length?`<div class="row">${bs.map(b=>`<div>${esc(b)}<b>${R(sum(cs.filter(t=>t.bank==b)))}</b></div>`).join('')}</div>`:''}</div>
  ${bs.length?bs.map(bank).join(''):'<div class="card"><div class="empty">Seus cartões aparecem aqui sozinhos depois que você sincronizar o Open Finance. Os bancos e os gastos vêm direto da conexão.</div></div>'}
  <div class="card"><h2>Open Finance</h2>
  <button class="btn" onclick="syncOF()">Sincronizar agora</button>
  <div id="ofs" style="margin-top:10px;color:var(--mu);font-size:14px">${S.ofAt?'Última sincronização: '+S.ofAt:'Ainda não sincronizado.'}</div>
  <button class="btn g" style="margin-top:10px" onclick="tab='settings';sv='of';render();scrollTo(0,0)">Configurar Open Finance</button></div>`;
}
async function syncOF(){
  const el=$('#ofs');
  if(!S.api){el.innerHTML='<div class="alert">Configure o Open Finance na engrenagem, em Configurações. Veja o guia de configuração do servidor.</div>';return}
  el.textContent='Sincronizando...';
  try{
    const r=await fetch(S.api.replace(/\/$/,'')+'/transactions',{headers:S.apiTok?{Authorization:'Bearer '+S.apiTok}:{}});if(!r.ok)throw 0;
    const ok=(await r.json()).filter(x=>x&&x.id&&x.date&&x.val>0&&x.bank);
    S.tx=S.tx.filter(t=>t.src!='of').concat(ok.map(x=>({id:'of'+x.id,type:'out',name:x.name||'Compra',val:+x.val,date:String(x.date).slice(0,10),cat:CAT[x.cat]?x.cat:'Outros',card:true,bank:String(x.bank).slice(0,30),src:'of'})));
    S.ofAt=new Date().toLocaleString('pt-BR');save();render();
  }catch(e){el.innerHTML='<div class="alert">Não consegui sincronizar. Confira o endereço do servidor.</div>'}
}
/* ===== INVESTIMENTOS ===== */
/* Taxas do simulador são ESTIMATIVAS editáveis */
const INV=[
{g:'Renda fixa',n:'CDB / CDI',r:14,cdi:100,d:'Rende uma % do CDI.'},
{g:'Renda fixa',n:'LCI / LCA',r:14,cdi:90,d:'Rende uma % do CDI e não paga IR para pessoa física.'},
{g:'Renda fixa',n:'Tesouro Selic',r:14.2,d:'Acompanha a taxa Selic.'},
{g:'Renda fixa',n:'Tesouro IPCA+',r:11,d:'Juro fixo mais a inflação.'},
{g:'Renda fixa',n:'Poupança',r:10,d:'Costuma render menos que CDB e Tesouro.'},
{g:'Outros',n:'Cofrinho',r:14,cdi:100,d:'Rendimento diário, em geral perto de 100% do CDI.'},
{g:'Outros',n:'Previdência',r:11,d:'PGBL ou VGBL, para o longo prazo.'},
{g:'Outros',n:'Fundos de investimento',r:12,d:'Dinheiro reunido e gerido por um gestor.'},
{g:'Bolsa',n:'Ações da B3',r:12,d:'Retorno variável, com risco de perda.'},
{g:'Bolsa',n:'Fundos imobiliários (FIIs)',r:11,d:'Pagam rendimentos todo mês.'},
{g:'Bolsa',n:'S&P 500 (EUA)',r:10,d:'As 500 maiores empresas dos EUA, em dólar.'}];
const PER=['24h','1 semana','1 mês','1 ano','Tudo'];
const MK={
moedas:{n:'Moedas',p:'aw',cur:'R$',a:[{c:'USD-BRL',n:'Dólar',s:'USD'},{c:'EUR-BRL',n:'Euro',s:'EUR'},{c:'GBP-BRL',n:'Libra esterlina',s:'GBP'},{c:'JPY-BRL',n:'Iene',s:'JPY'}]},
cripto:{n:'Cripto',p:'cg',cur:'R$',a:[{c:'bitcoin',n:'Bitcoin',s:'BTC'},{c:'ethereum',n:'Ethereum',s:'ETH'},{c:'tether',n:'Tether',s:'USDT'},{c:'solana',n:'Solana',s:'SOL'},{c:'ripple',n:'XRP',s:'XRP'}]},
nac:{n:'Ações nacionais',p:'br',cur:'R$',a:[['PETR4','Petrobras'],['VALE3','Vale'],['ITUB4','Itaú'],['BBDC4','Bradesco'],['BBAS3','Banco do Brasil'],['WEGE3','WEG'],['ABEV3','Ambev'],['MGLU3','Magalu']].map(x=>({c:x[0],n:x[1]}))},
fii:{n:'Fundos imobiliários',p:'br',cur:'R$',a:[['HGLG11','CSHG Logística'],['MXRF11','Maxi Renda'],['KNRI11','Kinea Renda Imobiliária'],['XPML11','XP Malls'],['VISC11','Vinci Shopping Centers']].map(x=>({c:x[0],n:x[1]}))},
etf:{n:'ETFs',p:'br',cur:'R$',a:[['BOVA11','Ibovespa'],['IVVB11','S&P 500 em reais'],['SMAL11','Small caps'],['HASH11','Cripto']].map(x=>({c:x[0],n:x[1]}))},
int:{n:'Ações internacionais',p:'av',cur:'US$',a:[['AAPL','Apple'],['MSFT','Microsoft'],['NVDA','Nvidia'],['TSLA','Tesla'],['AMZN','Amazon'],['GOOGL','Alphabet']].map(x=>({c:x[0],n:x[1]}))}};
const TILES=[['moedas','💱','Moedas'],['cripto','₿','Cripto'],['int','🌎','Ações internacionais'],['nac','↕️','Ações nacionais'],['fii','🏠','Fundos imobiliários'],['etf','📊','ETFs'],['sim:CDB / CDI','🏦','CDB liquidez diária'],['sim:Tesouro Selic','📈','Renda fixa'],['sim:LCI / LCA','🥧','LCI e LCA'],['sim:Fundos de investimento','💼','Fundos de investimento'],['sim:Previdência','🔐','Previdência'],['sim:Cofrinho','🐷','Cofrinhos']];
let iv={v:'grid'},req=0;
const go=o=>{iv=o;render();scrollTo(0,0)};
const tileGo=k=>k.startsWith('sim:')?go({v:'sim',n:k.slice(4)}):go({v:'list',k});
const openA=i=>go({v:'asset',k:iv.k,a:MK[iv.k].a[i],per:'1 mês'});
const setPer=p=>{iv.per=p;render()};
function openC(){const c=$('#cc').value.trim().toUpperCase();if(!c)return;go({v:'asset',k:iv.k,a:{c,n:c},per:'1 mês'})}
function invest(){return {grid:invGrid,list:invList,asset:assetView,sim:simView}[iv.v]()}
const CT=[...INV.map(i=>i.n),'Cripto','Moedas','Outro'];
const PC=['#E8E8E8','#9aa0a6','#C0C0C0','#6f6f6f','#d4d4d4','#8a8a8a','#b8b8b8','#a6a6a6','#7d7d7d','#f2f2f2','#5f5f5f','#cfcfcf','#909090','#bdbdbd'];
let selT=null,TS=[];
const curVal=p=>p.cur>0?p.cur:p.v*Math.pow(1+(p.r||0)/100,Math.max(0,(Date.now()-new Date(p.d).getTime())/864e5)/365);
const pickT=i=>{selT=selT==TS[i]?null:TS[i];render()};
function carteira(){
  const L=S.inv||[];
  const head=`<div class="mn"><h2 style="margin:0">Minha carteira</h2><button class="btn s g" onclick="posForm()">＋ Adicionar</button></div>`;
  if(!L.length)return `<div class="card">${head}<div class="empty">Cadastre os investimentos que você tem para ver o gráfico da carteira aqui.</div></div>`;
  const by={};L.forEach(p=>by[p.t]=(by[p.t]||0)+curVal(p));
  const ts=Object.entries(by).sort((a,b)=>b[1]-a[1]);TS=ts.map(x=>x[0]);
  if(selT&&!by[selT])selT=null;
  const tot=ts.reduce((a,x)=>a+x[1],0),inv=L.reduce((a,p)=>a+p.v,0),r=62,C=2*Math.PI*r;let acc=0;
  const seg=ts.map((x,i)=>{
    const len=Math.max(0,x[1]/tot*C-(ts.length>1?2:0));
    const el=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${PC[i%PC.length]}" stroke-width="${selT==x[0]?26:20}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 80 80)" style="cursor:pointer;opacity:${selT&&selT!=x[0]?.35:1}" onclick="pickT(${i})"/>`;
    acc+=x[1]/tot*C;return el;
  }).join('');
  const big=tot>=1e6?(tot/1e6).toFixed(2).replace('.',',')+' mi':R(tot).replace('R$ ','');

function localAnswer(q){
  q=q.toLowerCase();const c=byCat();
  if(q.includes('comiss')){
    const mk=month(),a=(S.cm||[]).filter(c=>c.d.startsWith(mk));
    if(!a.length)return 'Você ainda não cadastrou comissões neste mês. Use o botão ＋ e escolha Nova comissão.';
    const t=a.reduce((x,c)=>x+c.v,0),r=a.reduce((x,c)=>x+c.res,0),i=a.reduce((x,c)=>x+c.inv,0);
    return `Neste mês você recebeu ${R(t)} em comissões. Separado: ${R(r+i)} (reserva ${R(r)} e investimentos ${R(i)}). Livre: ${R(t-r-i)}.`;
  }
  if(q.includes('meta')){
    if(!S.goals.length)return 'Você ainda não criou metas. Abra a aba Metas e toque em Nova meta.';
    return S.goals.map(x=>{const r=Math.max(0,x.target-x.saved);return `${x.e||'🎯'} ${x.name}: ${Math.round(x.saved/x.target*100)}% (${R(x.saved)} de ${R(x.target)}). ${r>0?'Faltam '+R(r)+(x.monthly>0?', cerca de '+Math.ceil(r/x.monthly)+' meses guardando '+R(x.monthly)+' por mês.':'.'):'Meta alcançada!'}`}).join('\n');
  }
  for(const k in CAT){if(q.includes(k.toLowerCase()))return `Neste mês você gastou ${R(c[k]||0)} com ${k}.`}
  if(q.includes('sobr')||q.includes('saldo')||q.includes('livre')){const m=mesCalc();return `Neste mês: receitas ${R(m.rec)}, gastos ${R(m.gast)}, a pagar ${R(m.pagar)} e separado ${R(m.sep)}. Valor livre: ${R(m.livre)}.`}

async function hash(p,salt){
  try{
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h1=0xdeadbeef,h2=0x41c6ce57;const t=salt+p;
    for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
  }
}

const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){
  let c='';try{c=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>AL[x%AL.length]).join('')}catch(e){for(let i=0;i<12;i++)c+=AL[Math.floor(Math.random()*AL.length)]}
  return c.match(/.{4}/g).join('-');
}

  <div class="res" style="text-align:center;font-size:24px;font-weight:700;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace">${code}</div>

async function doRec(){

  try{
    const x=AC.users[u];

    if(n.length<6)return aerr('A nova senha precisa ter pelo menos 6 caracteres.');

      return enterCloud(data.user);

  $('#view').innerHTML={home,bills,cards,goals,invest,ai,settings,agenda,comm:comissao}[tab]();
  document.querySelectorAll('nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  if(tab=='invest'){if(iv.v=='sim')pick();if(iv.v=='asset')loadAsset();if(iv.v=='grid')quotesFor(['moedas','cripto']);if(iv.v=='list')quotesFor([iv.k])}
  if(tab=='ai'){const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
}
document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{if(tab==b.dataset.t&&tab=='invest')iv={v:'grid'};tab=b.dataset.t;render();scrollTo(0,0)});
$('#add').onclick=toggleQA;
$('#gear').onclick=()=>{tab='settings';sv='main';render();scrollTo(0,0)};
$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeForm()};
function applyTheme(){const d=S.theme?S.theme=='dark':true;document.documentElement.dataset.theme=d?'dark':'light';$('meta[name=theme-color]').content=d?'#000000':'#E8E8E8'}

$('#gear').innerHTML=ico('gear',22);
$('#agbtn').innerHTML=ico('cal',22);
$('#agbtn').onclick=()=>{tab='agenda';render();scrollTo(0,0)};
applyTheme();render();bootAuth();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
function endSplash(){$('#splash').classList.add('off')}
setTimeout(endSplash,matchMedia('(prefers-reduced-motion:reduce)').matches?1200:5600);
</script>
</body>
</html>
